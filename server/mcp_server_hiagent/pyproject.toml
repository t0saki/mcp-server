[project]
name = "mcp-server-hiagent"
version = "0.1.0"
description = "MCP server for HiAgent OpenAPI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.8.0",
]

[project.scripts]
mcp-server-hiagent = "mcp_server_hiagent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_hiagent"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
